name: Verify and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test (${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: original
            ref: ${{ github.sha }}
          - version: pixel-art
            ref: codex/pixel-art
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select the runner's Chrome
        run: |
          browser_path="$(command -v google-chrome)"
          "$browser_path" --version
          echo "DINO_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Verify production build
        run: npm run verify
      - name: Save QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-report-${{ matrix.version }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package the verified game
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: verified-${{ matrix.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the original version
        uses: actions/download-artifact@v5
        with:
          name: verified-original
          path: _site/
      - name: Download the pixel art version
        uses: actions/download-artifact@v5
        with:
          name: verified-pixel-art
          path: _site/pixel-art/
      - name: Check both entry points
        run: |
          test -f _site/index.html
          test -f _site/pixel-art/index.html
      - name: Package both versions together
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - uses: actions/configure-pages@v5
      - name: Deploy the verified game
        id: deployment
        uses: actions/deploy-pages@v4
